openapi: 3.0.3
info:
  title: HMS-VN Identity, RBAC & Staff API
  version: v1
servers:
  - url: /api/v1
paths:
  /auth/sessions:
    post:
      operationId: createSession
      summary: Create a staff JWT session
      responses:
        '200':
          description: Session created
        '401':
          description: Invalid credentials
        '429':
          description: Login attempt limit exceeded for the IP and username pair
  /auth/me:
    get:
      operationId: getCurrentPrincipal
      summary: Return the current authenticated principal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current principal
  /auth/password:
    put:
      operationId: changePassword
      summary: Change current principal password and revoke old JWTs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Password changed
  /staff-users:
    get:
      operationId: listStaffUsers
      summary: List staff users without credential fields
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            default: 1
            minimum: 1
            type: integer
        - in: query
          name: pageSize
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
        - in: query
          name: q
          schema:
            maxLength: 100
            type: string
        - in: query
          name: departmentId
          schema:
            maxLength: 36
            type: string
        - in: query
          name: isActive
          schema:
            type: boolean
      responses:
        '200':
          description: Staff page
        '403':
          description: Missing staff.read permission
    post:
      operationId: createStaffAccount
      summary: Create a staff account and return one-time temporary password
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Staff account created
          headers:
            Cache-Control:
              description: Always no-store because response includes a one-time temporary password
              schema:
                example: no-store
                type: string
        '403':
          description: Target role is outside the actor management scope
  /staff-users/{userId}:
    patch:
      operationId: updateStaffAccount
      summary: Update staff profile, active state, or single role with optimistic locking
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: If-Unmodified-Since
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Staff account updated
        '403':
          description: Target role is outside the actor management scope
        '409':
          description: Staff record was modified since read
        '428':
          description: If-Unmodified-Since header is required
  /staff-users/{userId}/password-resets:
    post:
      operationId: resetStaffPassword
      summary: Reset a staff password and return one-time temporary password
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Password reset
          headers:
            Cache-Control:
              description: Always no-store because response includes a one-time temporary password
              schema:
                example: no-store
                type: string
        '403':
          description: Target role is outside the actor management scope
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
